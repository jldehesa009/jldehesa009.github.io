<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control | Muro de Desahogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { background-color: #0a0a0f; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 3rem; border-radius: 16px; width: 90%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        textarea { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 1rem; border-radius: 8px; font-size: 1rem; font-family: inherit; resize: vertical; min-height: 100px; margin-bottom: 1rem; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: #fff; }
        button { width: 100%; padding: 1rem; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #e2e8f0; transform: translateY(-2px); }
        .danger-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; margin-top: 2rem; }
        .danger-btn:hover { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ingresar al Muro</h1>
        <form id="phrase-form">
            <textarea id="phrase-input" placeholder="Escribe lo que dice el post-it aquí..." required autofocus></textarea>
            <button type="submit">Enviar al Muro</button>
        </form>
        <button class="danger-btn" onclick="clearWall()">Limpiar Muro Completo</button>
    </div>

    <script>
        // 1. PEGA TU FIREBASE CONFIG AQUÍ:
        const firebaseConfig = {

  apiKey: "AIzaSyA67kd8YBNFW-TDxq65GSj1qH8KUZStLYY",

  authDomain: "muro-de-desahogo.firebaseapp.com",

  databaseURL: "https://muro-de-desahogo-default-rtdb.firebaseio.com",

  projectId: "muro-de-desahogo",

  storageBucket: "muro-de-desahogo.firebasestorage.app",

  messagingSenderId: "173042937532",

  appId: "1:173042937532:web:0a46243647cddf8f956ab9"

};


        // 2. Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const phrasesRef = database.ref('frases_muro'); // Creamos una "carpeta" en la nube

        // 3. Lógica del formulario
        const form = document.getElementById('phrase-form');
        const input = document.getElementById('phrase-input');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // Enviar a la nube
            phrasesRef.push({
                texto: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            input.value = '';
            input.focus();
        });

        // 4. Limpiar el muro desde la nube
        function clearWall() {
            if(confirm('¿Estás seguro de borrar TODAS las frases de la nube?')) {
                phrasesRef.remove();
            }
        }
    </script>
</body>
</html>
