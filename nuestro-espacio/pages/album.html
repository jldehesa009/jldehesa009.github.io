<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nuestra galería privada. El backstage de nuestra vida.">
    <title>Jorge & Mily | Álbum</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/album.css">
</head>
<body>
    <header class="navbar glass">
        <div class="nav-container">
            <a href="../index.html" class="logo">J<span>&</span>M</a>
            <nav class="nav-links">
                <a href="contador.html">Contador</a>
                <a href="capsula.html">Cápsula</a>
                <a href="timeline.html">Timeline</a>
                <a href="trivia.html">Trivia</a>
                <a href="citas.html">Citas</a>
                <a href="album.html" class="active">Álbum</a>
                <a href="historico.html">Histórico</a>
            </nav>
            </nav>
            <div class="nav-controls">
                <button class="hamburger" aria-label="Menú">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="page-container">
        <section class="album-header text-center">
            <div class="container observe-fade">
                <h1>Nuestro <span class="gold-accent">Backstage</span></h1>
                <p>Las capturas de nuestros mejores conciertos, ensayos y momentos detrás de escena.</p>
                
                <div class="gallery-filters">
                    <button class="filter-btn active" data-filter="all">Todo</button>
                    <button class="filter-btn" data-filter="viajes">Viajes</button>
                    <button class="filter-btn" data-filter="musica">Música</button>
                    <button class="filter-btn" data-filter="random">Random</button>
                </div>
            </div>
        </section>

        <section class="upload-section observe-fade is-visible" style="margin-top: 3rem;">
            <div class="container"> <div class="form-wrapper glass">
                    <h2>Añadir al Backstage</h2>
                    <form id="album-form">
                        <div class="form-group">
                            <label for="photo-file">Selecciona una foto:</label>
                            <input type="file" id="photo-file" accept="image/*" required class="w-100">
                        </div>
                        <div class="form-group">
                            <label for="photo-caption">Pie de foto (opcional):</label>
                            <input type="text" id="photo-caption" placeholder="¿Qué estábamos haciendo aquí?" class="w-100">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Subir a la Galería</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE LA GALERÍA -->
        <section class="gallery-section">
            <div class="container">
                <!-- 👇 CORRECCIÓN: ID cambiado a album-grid y clase a capsules-grid para el CSS 👇 -->
                <div id="album-grid" class="capsules-grid">
                </div>
            </div>
        </section>
    </main>

    <!-- LIGHTBOX (Para ampliar fotos, lo dejé intacto) -->
    <div id="lightbox" class="lightbox hide">
        <div class="lightbox-overlay"></div>
        <button id="lightbox-close" class="lightbox-close icon-btn">&times;</button>
        
        <div class="lightbox-content">
            <button id="lightbox-prev" class="lightbox-nav prev">&lt;</button>
            
            <div class="lightbox-image-container">
                <img id="lightbox-img" src="" alt="Imagen ampliada">
                <div id="lightbox-caption" class="lightbox-caption"></div>
            </div>
            
            <button id="lightbox-next" class="lightbox-nav next">&gt;</button>
        </div>
    </div>

    <!-- 👇 NUEVO: TOAST DE NOTIFICACIONES PARA QUE EL JS PUEDA "HABLAR" 👇 -->
    <div id="toast" class="toast hide">
        <span id="toast-message"></span>
    </div>

    <footer class="footer glass">
        <div class="container footer-content">
            <p>Hecho con amor. Jorge & Mily &copy; <span id="year"></span></p>
        </div>
    </footer>

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/presence.js"></script>
    
    <script type="module" src="../js/album.js"></script>
    
    <script src="../js/app.js"></script>
</body>
</html>
