                    </div>
                    <div class="time-box glass">
                        <span id="minutes" class="time-value">0</span>
                        <span class="time-label">Minutos</span>
                    </div>
                    <div class="time-box glass highlight">
                        <span id="seconds" class="time-value">0</span>
                        <span class="time-label">Segundos</span>
                    </div>
                </div>
                
                <div class="anniversary-alert glass hide" id="anniversary-alert">

                    <button id="play-sound-btn" class="btn btn-primary" style="margin-left: 1rem; padding: 0.5rem 1rem; font-size: 0.8rem;">Reproducir Melodía</button>

            </div>
