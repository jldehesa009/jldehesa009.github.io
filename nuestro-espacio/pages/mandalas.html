<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galería de arte y mandalas.">
    <title>Jorge & Mily | Exposición de Mandalas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/album.css">
    <link rel="stylesheet" href="../css/mandalas.css">
<link rel="icon" type="image/png" href="/nuestro-espacio/assets/icons/favicon.png">
</head>
<body>
    <header class="navbar glass">
        <div class="nav-container">
            <a href="../index.html" class="logo">J<span>&</span>M</a>
            <nav class="nav-links">
                <a href="contador.html">Contador</a>
                <a href="capsula.html">Cápsula</a>
                <a href="timeline.html">Timeline</a>
                <a href="citas.html">Citas</a>
                <a href="album.html">Álbum</a>
                <a href="historico.html">Histórico</a>                
                <a href="mandalasprueba.html" class="active">Mandalas</a>
            </nav>
            <div class="nav-controls">
                <button class="hamburger" aria-label="Menú">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="page-container">
        <section class="album-header text-center">
            <div class="container observe-fade is-visible">
                <h1>El Arte de <span class="gold-accent">Mily</span></h1>
                <p>Nuestra exposición privada de mandalas.</p>
            </div>
        </section>

        <section class="upload-section observe-fade is-visible" style="position: relative; z-index: 10;">
            <div class="container"> 
                <div class="form-wrapper glass">
                    <h2>Exhibir Nueva Obra</h2>
                    <form id="mandala-form">
                        <div class="form-group">
                            <label for="photo-file">Selecciona el mandala:</label>
                            <input type="file" id="photo-file" accept="image/*" required class="w-100">
                        </div>
                        <div class="form-group">
                            <label for="photo-caption">Título de la obra:</label>
                            <input type="text" id="photo-caption" placeholder="Ej: Mandala de la tranquilidad..." class="w-100" autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Colgar en la Galería</button>
                    </form>
                </div>
            </div>
        </section>

        <section class="museum-hall">
            <div class="museum-wall">
                <div id="mandala-grid" class="museum-gallery-flow"></div>
                <div class="museum-baseboard"></div>
            </div>
            <div class="museum-floor"></div>
        </section>
    </main>

    <div id="lightbox" class="lightbox hide">
        <button id="lightbox-close" class="lightbox-close">&times;</button>
        <button id="lightbox-prev" class="lightbox-nav prev">&lt;</button>
        
        <div class="lightbox-image-container">
            <img id="lightbox-img" src="" alt="Obra ampliada">
            <div id="lightbox-caption"></div>
        </div>
        
        <button id="lightbox-next" class="lightbox-nav next">&gt;</button>
    </div>

    <div id="toast" class="toast hide">
        <span id="toast-message"></span>
    </div>

    <footer class="museum-footer text-center">
        <p>&copy; 2026 Código por Jorge Dehesa - Arte por Milagros Gómez. Todos los derechos reservados.</p>
    </footer>

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/presence.js"></script>
    <script type="module" src="../js/mandalas.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
