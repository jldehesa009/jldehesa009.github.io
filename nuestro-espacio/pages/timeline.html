<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nuestra historia contada como el setlist del mejor concierto.">
    <title>Jorge & Mily | Setlist (Timeline)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/timeline.css">
<link rel="icon" type="image/png" href="/nuestro-espacio/assets/icons/favicon.png">
</head>
<body>
    <header class="navbar glass">
        <div class="nav-container">
            <a href="../index.html" class="logo">J<span>&</span>M</a>
            <nav class="nav-links">
                <a href="contador.html">Contador</a>
                <a href="capsula.html">Cápsula</a>
                <a href="timeline.html" class="active">Timeline</a>
                <a href="citas.html">Citas</a>
                <a href="album.html">Álbum</a>
                <a href="historico.html">Histórico</a>
                <a href="mandalas.html">Mandalas</a>
            </nav>
            <div class="nav-controls">
                <button class="hamburger" aria-label="Menú">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="page-container">
        <section class="timeline-header text-center">
            <div class="container observe-fade">
                <h1>Nuestro <span class="gold-accent">Setlist</span></h1>
                <p>Las canciones de nuestra vida, tocadas en el orden en que las vivimos.</p>
            </div>
        </section>

        <section class="timeline-section">
            <div class="container timeline-container" id="timeline-container">
                <div class="timeline-line"></div>
                <div class="timeline-line-progress" id="timeline-progress"></div>

                </div>
        </section>
    </main>

    <button class="fab-add" id="btn-open-modal" aria-label="Agregar Track">+</button>

    <div class="modal-overlay hide" id="timeline-modal">
        <div class="modal-content glass">
            <h2>Agregar Nuevo <span class="gold-accent">Track</span></h2>
            <form id="timeline-form">
                <div class="form-group">
                    <label for="track-title">Nombre del Recuerdo (Canción)</label>
                    <input type="text" id="track-title" required placeholder="Ej. Nuestro Primer Concierto">
                </div>
                <div class="form-group">
                    <label for="track-date">Fecha del Suceso</label>
                    <input type="date" id="track-date" required>
                </div>
                <div class="form-group">
                    <label for="track-img">URL de la Imagen (Unsplash o similar)</label>
                    <input type="url" id="track-img" placeholder="https://images.unsplash.com/...">
                </div>
                <div class="form-group">
                    <label for="track-desc">La Historia (Anécdota)</label>
                    <textarea id="track-desc" rows="3" required placeholder="Cuéntame qué pasó..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="btn-close-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Grabar Track 🎙️</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer glass">
        <div class="container footer-content">
            <p>Hecho con amor. Jorge & Mily &copy; <span id="year"></span></p>
        </div>
    </footer>
    
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script type="module" src="../js/timeline.js"></script>
</body>
</html>
